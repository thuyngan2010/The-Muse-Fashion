                      $ref: '#/components/schemas/Review'
  /admin/refunds/{refundId}/reject:
    patch:
      tags:
        - Operations
      operationId: rejectRefundProposal
      x-implementation-status: implemented
      x-permissions:
        - ADMIN
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '409':
          $ref: '#/components/responses/Conflict'
      description: >-
        Reject a PENDING_APPROVAL proposal without transfer evidence. Approved transfers must use
        /fail with evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
  /payments/order/{orderId}/latest:
    get:
      tags:
        - Payment
      operationId: latestPaymentForOrder
      x-implementation-status: implemented
      x-permissions:
        - CUSTOMER_OWNER
        - ADMIN
        - payment.read
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
  /admin/payment-events/{eventId}:
    get:
      tags:
        - Operations
      operationId: getPaymentEventReview
      x-implementation-status: implemented
      x-permissions:
        - ADMIN
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReviewEvent'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    AddressId: {name: addressId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    ProductId: {name: productId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    LookbookId: {name: lookbookId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    VoucherId: {name: voucherId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    PostId: {name: postId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    TargetId: {name: targetId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    UserId: {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
    StaffId: {name: staffId, in: path, required: true, schema: {$ref: '#/components/schemas/ObjectId'}}
  requestBodies:
    ProfileWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              fullName: {type: string, minLength: 2, maxLength: 100}
              phone: {type: [string, 'null'], pattern: '^\\+?[0-9]{8,15}$'}
              avatarMediaId: {anyOf: [$ref: '#/components/schemas/ObjectId', 
                      type: 'null']}
    AddressWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/AddressWrite'}
            unevaluatedProperties: false
    CategoryWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/CategoryWrite'}
            unevaluatedProperties: false
    VariantWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/VariantWrite'}
            unevaluatedProperties: false
    LookbookWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/LookbookWrite'}
            unevaluatedProperties: false
    CartWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  required: [variantId, quantity]
                  properties:
                    variantId: {$ref: '#/components/schemas/ObjectId'}
                    quantity: {type: integer, minimum: 1, maximum: 99}
    OrderStatusWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [state, reason]
            properties:
              state: {type: string, enum: [CONFIRMED, PREPARING, SHIPPING, 
                    DELIVERED, CANCEL_PENDING_REFUND, CANCELLED]}
              reason: {type: string, minLength: 3, maxLength: 500}
              expectedVersion: {type: integer, minimum: 1}
    ShipmentWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [carrier, trackingCode, status]
            properties:
              carrier: {type: string, minLength: 1, maxLength: 100}
              trackingCode: {type: string, minLength: 1, maxLength: 100}
              status: {type: string, enum: [READY, PICKED_UP, IN_TRANSIT, 
                    DELIVERED, FAILED]}
              note: {type: string, maxLength: 500}
    InventoryAdjustmentWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [variantId, delta, reason, expectedVersion]
            properties:
              variantId: {$ref: '#/components/schemas/ObjectId'}
              delta: {type: integer, minimum: -100000, maximum: 100000, not: {
                    const: 0}}
              reason: {type: string, minLength: 3, maxLength: 500}
              expectedVersion: {type: integer, minimum: 1}
    VoucherWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/VoucherWrite'}
            unevaluatedProperties: false
    ReviewWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/ReviewWrite'}
            unevaluatedProperties: false
    PostWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/PostWrite'}
            unevaluatedProperties: false
    CommentWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body: {type: string, minLength: 1, maxLength: 2000}
              parentId: {anyOf: [$ref: '#/components/schemas/ObjectId', type: 'null']}
    ModerationWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [targetType, action, reason]
            properties:
              targetType: {type: string, enum: [REVIEW, POST, COMMENT]}
              action: {type: string, enum: [HIDE, RESTORE]}
              reason: {type: string, minLength: 3, maxLength: 500}
    SettingsWrite:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SystemSettings'}
    AiQuotaWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [dailyJobs]
            properties:
              dailyJobs: {type: integer, minimum: 0, maximum: 100, default: 5}
    AiJobWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [inputMediaId, productIds, consentPolicyVersion]
            properties:
              inputMediaId: {$ref: '#/components/schemas/ObjectId'}
              productIds:
                type: array
                minItems: 1
                maxItems: 5
                uniqueItems: true
                items: {$ref: '#/components/schemas/ObjectId'}
              consentPolicyVersion: {type: string, minLength: 1, maxLength: 50}
              style: {type: string, enum: [office, streetwear, evening, minimalist], description: 'Optional styling context for outfit planning; participates in idempotency matching.'}
  schemas:
    PaymentReviewEvent:
      type: object
      required:
        - id
        - provider
        - eventId
        - resolution
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        provider:
          type: string
          enum:
            - GPMPAY
            - SEPAY
        eventId:
          type: string
        resolution:
          type: string
        transferType:
          type: string
        transferAmount:
          type: integer
        proposal:
          type:
            - object
            - 'null'
          properties:
            decision:
              type: string
            proposedBy:
              $ref: '#/components/schemas/ObjectId'
            proposedAt:
              type: string
              format: date-time
            amount:
              type: integer
        proposalDetail:
          type:
            - object
            - 'null'
          description: Admin detail only; signed private evidence URL expires.
          properties:
            note:
              type: string
            bankReference:
              type: string
            evidenceUrl:
              type:
                - string
                - 'null'
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
    Money:
      type: integer
      minimum: 0
      description: Integer VND
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, password]
      properties:
        fullName: {type: string, minLength: 2, maxLength: 100}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128}
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        remember:
          type: boolean
          default: true
          description: False uses an HttpOnly session cookie; access tokens remain in memory.
    AuthSession:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, const: 3600}
        user: {$ref: '#/components/schemas/UserSummary'}
    UserSummary:
      type: object
      required:
        - id
        - email
        - fullName
        - role
        - status
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum:
            - CUSTOMER
            - STAFF
            - ADMIN
        status:
          type: string
          enum:
            - PENDING_VERIFICATION
            - ACTIVE
            - SUSPENDED
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/StaffPermissionGrant'
    StaffPermissionGrant:
      type: object
      additionalProperties: false
      required: [permission, scope]
      properties:
        permission:
          type: string
          enum: [catalog.manage, inventory.manage, order.read, order.manage, 
              order.cancel, shipment.manage, payment.read, refund.propose, 
              content.moderate]
        scope: {type: string, enum: [GLOBAL, ASSIGNED]}
    ProductWrite:
      type: object
      required: [name, slug, status]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        description: {type: string, maxLength: 10000}
        status: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}
    UserProfile:
      allOf:
      - {$ref: '#/components/schemas/UserSummary'}
      - type: object
        properties:
          phone: {type: [string, 'null'], pattern: '^\\+?[0-9]{8,15}$'}
          avatarMediaId: {anyOf: [$ref: '#/components/schemas/ObjectId', type: 'null']}
          createdAt: {type: string, format: date-time}
      unevaluatedProperties: false
    AddressWrite:
      type: object
      required: [receiver, phone, line1, ward, district, province]
      properties:
        receiver: {type: string, minLength: 2, maxLength: 100}
        phone: {type: string, pattern: '^\\+?[0-9]{8,15}$'}
        line1: {type: string, minLength: 3, maxLength: 255}
        ward: {type: string, minLength: 1, maxLength: 100}
        district: {type: string, minLength: 1, maxLength: 100}
        province: {type: string, minLength: 1, maxLength: 100}
        note: {type: string, maxLength: 300}
        isDefault: {type: boolean, default: false}
    Address:
      allOf:
      - {$ref: '#/components/schemas/AddressWrite'}
      - type: object
        required: [id]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
      unevaluatedProperties: false
    CategoryWrite:
      type: object
      required: [name, slug, status]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        parentId: {anyOf: [$ref: '#/components/schemas/ObjectId', type: 'null']}
        status: {type: string, enum: [ACTIVE, HIDDEN]}
    Category:
      allOf:
      - {$ref: '#/components/schemas/CategoryWrite'}
      - type: object
        required: [id]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
      unevaluatedProperties: false
    VariantWrite:
      type: object
      required: [sku, size, color, price, stockOnHand]
      properties:
        sku: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9._-]+$'}
        size: {type: string, minLength: 1, maxLength: 30}
        color: {type: string, minLength: 1, maxLength: 50}
        price: {$ref: '#/components/schemas/Money'}
        stockOnHand: {type: integer, minimum: 0}
    ProductVariant:
      allOf:
      - {$ref: '#/components/schemas/VariantWrite'}
      - type: object
        required: [id, reserved, available]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
          reserved: {type: integer, minimum: 0}
          available: {type: integer, minimum: 0}
      unevaluatedProperties: false
    LookbookWrite:
      type: object
      required: [title, status, mainMediaId, items]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        status: {type: string, enum: [DRAFT, PUBLISHED, HIDDEN]}
        mainMediaId: {$ref: '#/components/schemas/ObjectId'}
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 50}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [productId, x, y]
            properties:
              productId: {$ref: '#/components/schemas/ObjectId'}
              x: {type: number, minimum: 0, maximum: 1}
              y: {type: number, minimum: 0, maximum: 1}
    Lookbook:
      allOf:
      - {$ref: '#/components/schemas/LookbookWrite'}
      - type: object
        required: [id, version]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
          version: {type: integer, minimum: 1}
      unevaluatedProperties: false
    PresignedUpload:
      type: object
      additionalProperties: false
      required: [uploadUrl, objectKey, expiresInSeconds, contentLengthBytes, requiredHeaders]
      properties:
        uploadUrl: {type: string, format: uri}
        objectKey: {type: string}
        expiresInSeconds: {type: integer, minimum: 1, maximum: 300}
        contentLengthBytes: {type: integer, minimum: 1, maximum: 10485760}
        requiredHeaders: {type: object, additionalProperties: {type: string}}
    MediaObject:
      type: object
      additionalProperties: false
      required: [id, purpose, visibility, status, contentType, sizeBytes]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        purpose: {type: string, enum: [avatar, product, lookbook, community, 
              tryon]}
        visibility: {type: string, enum: [PRIVATE, PUBLIC]}
        status: {type: string, enum: [ACTIVE, QUARANTINED, DELETED]}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
        sizeBytes: {type: integer, minimum: 1, maximum: 10485760}
        expiresAt: {type: [string, 'null'], format: date-time}
    Cart:
      type: object
      additionalProperties: false
      required: [items, subtotal, updatedAt]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [variantId, sku, productName, quantity, unitPrice, 
                available]
            properties:
              variantId: {$ref: '#/components/schemas/ObjectId'}
              sku: {type: string}
              productName: {type: string}
              quantity: {type: integer, minimum: 1, maximum: 99}
              unitPrice: {$ref: '#/components/schemas/Money'}
              available: {type: integer, minimum: 0}
        subtotal: {$ref: '#/components/schemas/Money'}
        updatedAt: {type: string, format: date-time}
    Shipment:
      type: object
      additionalProperties: false
      required: [id, orderId, carrier, trackingCode, status, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        orderId: {$ref: '#/components/schemas/ObjectId'}
        carrier: {type: string}
        trackingCode: {type: string}
        status: {type: string, enum: [READY, PICKED_UP, IN_TRANSIT, DELIVERED, 
              FAILED]}
        updatedAt: {type: string, format: date-time}
    InventoryItem:
      type: object
      additionalProperties: false
      required: [variantId, sku, stockOnHand, reserved, available, version]
      properties:
        variantId: {$ref: '#/components/schemas/ObjectId'}
        sku: {type: string}
        stockOnHand: {type: integer, minimum: 0}
        reserved: {type: integer, minimum: 0}
        available: {type: integer, minimum: 0}
        version: {type: integer, minimum: 1}
    VoucherWrite:
      type: object
      required: [code, type, value, validFrom, validTo, usageLimit, status]
      properties:
        code: {type: string, minLength: 3, maxLength: 50, pattern: '^[A-Z0-9_-]+$'}
        type: {type: string, enum: [FIXED, PERCENT]}
        value: {type: integer, minimum: 1}
        maxDiscount: {anyOf: [$ref: '#/components/schemas/Money', type: 'null']}
        minimumSubtotal: {$ref: '#/components/schemas/Money'}
        validFrom: {type: string, format: date-time}
        validTo: {type: string, format: date-time}
        usageLimit: {type: integer, minimum: 1}
        status: {type: string, enum: [ACTIVE, DISABLED]}
    Voucher:
      allOf:
      - {$ref: '#/components/schemas/VoucherWrite'}
      - type: object
        required: [id, usedCount]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
          usedCount: {type: integer, minimum: 0}
      unevaluatedProperties: false
    ReviewWrite:
      type: object
      required: [orderItemId, stars, content]
      properties:
        orderItemId: {$ref: '#/components/schemas/ObjectId'}
        stars: {type: integer, minimum: 1, maximum: 5}
        content: {type: string, minLength: 1, maxLength: 5000}
        mediaIds:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {$ref: '#/components/schemas/ObjectId'}
    Review:
      allOf:
      - {$ref: '#/components/schemas/ReviewWrite'}
      - type: object
        required: [id, customerId, status, createdAt]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
          customerId: {$ref: '#/components/schemas/ObjectId'}
          status: {type: string, enum: [PUBLIC, HIDDEN, PENDING_REVIEW]}
          createdAt: {type: string, format: date-time}
      unevaluatedProperties: false
    PostWrite:
      type: object
      required: [caption, mediaIds]
      properties:
        caption: {type: string, minLength: 1, maxLength: 5000}
        mediaIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {$ref: '#/components/schemas/ObjectId'}
    CommunityPost:
      allOf:
      - {$ref: '#/components/schemas/PostWrite'}
      - type: object
        required: [id, authorId, status, createdAt]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
          authorId: {$ref: '#/components/schemas/ObjectId'}
          status: {type: string, enum: [PUBLIC, HIDDEN, PENDING_REVIEW]}
          createdAt: {type: string, format: date-time}
      unevaluatedProperties: false
    Comment:
      type: object
      additionalProperties: false
      required: [id, postId, authorId, body, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        postId: {$ref: '#/components/schemas/ObjectId'}
        authorId: {$ref: '#/components/schemas/ObjectId'}
        parentId: {anyOf: [$ref: '#/components/schemas/ObjectId', type: 'null']}
        body: {type: string, minLength: 1, maxLength: 2000}
        status: {type: string, enum: [PUBLIC, HIDDEN]}
        createdAt: {type: string, format: date-time}
    ModerationLog:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, action, reason, actorId, createdAt]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        targetType: {type: string, enum: [REVIEW, POST, COMMENT]}
        targetId: {$ref: '#/components/schemas/ObjectId'}
        action: {type: string, enum: [HIDE, RESTORE]}
        reason: {type: string}
        actorId: {$ref: '#/components/schemas/ObjectId'}
        createdAt: {type: string, format: date-time}
    SystemSettings:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        standardShippingFee: {$ref: '#/components/schemas/Money'}
        freeShippingThreshold: {$ref: '#/components/schemas/Money'}
        lowStockThreshold: {type: integer, minimum: 0, maximum: 9999, default: 5}
        aiDailyJobs: {type: integer, minimum: 0, maximum: 100, default: 5}
    AiQuota:
      type: object
      additionalProperties: false
      required: [dailyJobs, effectiveAt, updatedAt]
      properties:
        dailyJobs: {type: integer, minimum: 0, maximum: 100}
        effectiveAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SalesReport:
      type: object
      additionalProperties: false
      required: [from, to, timezone, paidRevenue, refundedAmount, netRevenue, 
          orderCount, topProducts]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        timezone: {type: string, const: Asia/Ho_Chi_Minh}
        paidRevenue: {$ref: '#/components/schemas/Money'}
        refundedAmount: {$ref: '#/components/schemas/Money'}
        netRevenue: {type: integer}
        orderCount: {type: integer, minimum: 0}
        topProducts:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: {$ref: '#/components/schemas/ObjectId'}
              quantity: {type: integer, minimum: 0}
    Product:
      allOf:
      - {$ref: '#/components/schemas/ProductWrite'}
      - type: object
        required: [id, variants]
        properties:
          id: {$ref: '#/components/schemas/ObjectId'}
          variants:
            type: array
            items:
              type: object
              required: [id, sku, size, color, price, available]
              properties:
                id: {$ref: '#/components/schemas/ObjectId'}
                sku: {type: string}
                size: {type: string}
                color: {type: string}
                price: {$ref: '#/components/schemas/Money'}
                available: {type: integer, minimum: 0}
      unevaluatedProperties: false
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: {type: integer, minimum: 1, maximum: 1000000}
        limit: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, minimum: 0}
    CheckoutQuote:
      type: object
      additionalProperties: false
      required: [id, subtotal, shippingFee, voucherDiscount, payableTotal, 
          expiresAt]
      properties:
        id: {type: string, format: uuid}
        subtotal: {$ref: '#/components/schemas/Money'}
        shippingFee: {$ref: '#/components/schemas/Money'}
        voucherDiscount: {$ref: '#/components/schemas/Money'}
        payableTotal: {$ref: '#/components/schemas/Money'}
        expiresAt: {type: string, format: date-time}
    Order:
      type: object
      required: [id, code, state, money, paymentDueAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        code: {type: string}
        state:
          type: string
          enum: [PENDING_PAYMENT, CONFIRMED, PREPARING, SHIPPING, DELIVERED, 
              CANCEL_PENDING_REFUND, CANCELLED]
        money:
          type: object
          required: [subtotal, shippingFee, voucherDiscount, payableTotal]
          properties:
            subtotal: {$ref: '#/components/schemas/Money'}
            shippingFee: {$ref: '#/components/schemas/Money'}
            voucherDiscount: {$ref: '#/components/schemas/Money'}
            payableTotal: {$ref: '#/components/schemas/Money'}
        paymentDueAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    PaymentAttempt:
      type: object
      required:
        - id
        - orderId
        - provider
        - state
        - amount
        - currency
        - reconciliationCode
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        orderId:
          $ref: '#/components/schemas/ObjectId'
        provider:
          type: string
          enum:
            - GPMPAY
            - SEPAY
        state:
          type: string
          enum:
            - PENDING
            - SUCCEEDED
            - FAILED
            - REQUIRES_REVIEW
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: VND
        reconciliationCode:
          type: string
          pattern: ^FC[A-Z0-9]{8,20}$
        qrImageUrl:
          type: string
          format: uri
        bank:
          type: object
          properties:
            bin:
              type: string
            accountNumberMasked:
              type: string
            accountName:
              type: string
        expiresAt:
          type: string
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
        hasOpenReview:
          type: boolean
        canRetry:
          type: boolean
        reviewOutcome:
          type:
            - string
            - 'null'
          enum:
            - REFUNDED_EXTERNALLY
            - null
    RefundBeneficiary:
      type: object
      additionalProperties: false
      required: [bankBin, accountNumber, accountName]
      properties:
        bankBin: {type: string, pattern: '^[0-9]{6}$'}
        accountNumber: {type: string, minLength: 4, maxLength: 34}
        accountName: {type: string, minLength: 2, maxLength: 120}
    Refund:
      type: object
      required:
        - id
        - paymentAttemptId
        - amount
        - state
        - proposedBy
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        paymentAttemptId:
          $ref: '#/components/schemas/ObjectId'
        amount:
          $ref: '#/components/schemas/Money'
        state:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - SUCCEEDED
            - FAILED
        proposedBy:
          $ref: '#/components/schemas/ObjectId'
        approvedBy:
          $ref: '#/components/schemas/ObjectId'
        confirmedBy:
          $ref: '#/components/schemas/ObjectId'
        bankReference:
          type: string
        beneficiary:
          $ref: '#/components/schemas/RefundBeneficiary'
        reconciliationCode:
          type: string
          pattern: ^RF[A-Z0-9]{8,20}$
        transferContent:
          type: string
          maxLength: 50
        qrImageUrl:
          type: string
          format: uri
        approvedAt:
          type: string
          format: date-time
        matchedEventId:
          type: string
        refundedAt:
          type: string
          format: date-time
        failureReason:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    AiJob:
      type: object
      required: [id, type, state, quotaCharged, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        type: {type: string, enum: [TRY_ON, MIX_MATCH]}
        state: {type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED, 
              EXPIRED]}
        phase: {type: string, enum: [QUEUED, ANALYZING, PLANNING, GENERATING, COMPLETED, FAILED]}
        planSummary: {type: [string, 'null'], maxLength: 500}
        detectedItems:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              productId: {$ref: '#/components/schemas/ObjectId'}
              category: {type: string, enum: [top, bottom, dress, outerwear, shoes, sandals, glasses, hat, bag, belt, scarf, necklace, earrings, bracelet, watch, ring]}
              targetRegion: {type: string, enum: [face, head, torso, legs, feet, shoulders, waist, neck, hands, ears, wrists]}
        quotaCharged: {type: boolean}
        resultUrls:
          type: array
          items: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, createdAt]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        reference: {type: object, additionalProperties: true}
        readAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      additionalProperties: false
      required: [statusCode, code, message, requestId]
      properties:
        statusCode: {type: integer}
        code:
          type: string
          enum: [VALIDATION_FAILED, WEBHOOK_SIGNATURE_INVALID, AUTH_REQUIRED, 
              INVALID_CREDENTIALS, SESSION_REVOKED, PERMISSION_DENIED, 
              RESOURCE_NOT_FOUND, DUPLICATE_RESOURCE, IDEMPOTENCY_CONFLICT, 
              STATE_CONFLICT, OUT_OF_STOCK, BUSINESS_RULE_FAILED, RATE_LIMITED, 
              QUOTA_EXCEEDED, PROVIDER_UNAVAILABLE, INTERNAL_ERROR]
        message: {type: string}
        requestId: {type: string, format: uuid}
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
  responses:
    UserProfileResponse:
      description: User profile
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UserProfile'}
    UserListResponse:
      description: Users visible to Admin
      content:
        application/json:
          schema:
            type: object
            required: [items, page, limit, total]
            properties:
              items:
                type: array
                items: {$ref: '#/components/schemas/UserSummary'}
              page: {type: integer, minimum: 1, maximum: 1000000}
              limit: {type: integer, minimum: 1, maximum: 50}
              total: {type: integer, minimum: 0}
    AddressResponse:
      description: Address
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Address'}
    AddressListResponse:
      description: Addresses
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Address'}
    PresignedUploadResponse:
      description: Signed upload data
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PresignedUpload'}
    MediaObjectResponse:
      description: Validated media object
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MediaObject'}
    CategoryResponse:
      description: Category
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Category'}
    CategoryListResponse:
      description: Categories
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Category'}
    ProductVariantResponse:
      description: Product variant
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProductVariant'}
    LookbookResponse:
      description: Lookbook
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Lookbook'}
    LookbookListResponse:
      description: Lookbooks
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Lookbook'}
    AiJobResponse:
      description: AI job accepted or read
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AiJob'}
    CartResponse:
      description: Current cart with current-price projection; no stock 
