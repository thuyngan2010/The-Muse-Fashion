        application/json:
          schema: {$ref: '#/components/schemas/Cart'}
    ShipmentResponse:
      description: Shipment
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Shipment'}
    InventoryItemResponse:
      description: Inventory item after adjustment
      content:
        application/json:
