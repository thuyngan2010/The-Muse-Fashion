openapi: 3.1.0
info:
  title: Fashion Commerce API
  version: 1.0.0
  description: Canonical HTTP contract. Routes have business implementations; 
    integration acceptance remains pending.
servers:
- url: /api/v1
tags:
- name: Auth
- name: Catalog
- name: Commerce
- name: Payment
- name: Operations
- name: Experience
- name: Notification
paths:
  /health:
    get:
      operationId: health
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Database and worker readiness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
        '503': {$ref: '#/components/responses/Unavailable'}
  /health/live:
    get:
      operationId: healthLive
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Process liveness
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: fashion-api}
                  timestamp: {type: string, format: date-time}
  /health/ready:
    get:
      operationId: healthReady
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Database and worker readiness
          content:
            application/json:
              schema:
                type: object
                required: [status, service, database, timestamp]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: fashion-api}
                  database: {type: string, const: ready}
                  timestamp: {type: string, format: date-time}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/AcceptedResource'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      security: []
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 32, maxLength: 2048}
      responses:
        '200': {$ref: '#/components/responses/Message'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '201':
          description: Session created
          headers:
            Set-Cookie:
              description: HttpOnly Secure SameSite=Lax refresh token cookie
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security:
      - refreshCookie: []
      x-implementation-status: partial
      responses:
        '201':
          description: Rotated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
      - refreshCookie: []
      x-implementation-status: partial
      responses:
        '204': {description: Current session revoked}
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202': {$ref: '#/components/responses/Message'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: {type: string, minLength: 32, maxLength: 2048}
                newPassword: {type: string, minLength: 12, maxLength: 128}
      responses:
        '200': {$ref: '#/components/responses/Message'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getPrincipal
      x-implementation-status: implemented
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      security: []
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Limit'}
      - name: q
        in: query
        description: Whole-keyword text search across indexed product name and description; not substring matching
        schema: {type: string, maxLength: 100}
      - name: category
        in: query
        schema: {type: string, maxLength: 100}
      - name: sort
        in: query
        schema: {type: string, enum: [newest, price_asc, price_desc, name_asc]}
      responses:
        '200':
          description: Published products
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageMeta'}
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/Product'}
        '400': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Catalog]
      operationId: createProduct
      x-permissions: [ADMIN, catalog.manage]
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/ProductWrite'}
              unevaluatedProperties: false
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      security: []
      x-implementation-status: partial
      parameters:
      - name: slug
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
      responses:
        '200':
          description: Published product detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
  /checkout/quote:
    post:
      tags: [Commerce]
      operationId: createCheckoutQuote
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [addressId]
              properties:
                addressId: {$ref: '#/components/schemas/ObjectId'}
                voucherCode: {type: string, minLength: 1, maxLength: 50}
                shippingMethod: {type: string, const: STANDARD}
      responses:
        '200':
          description: Server-calculated quote valid for ten minutes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutQuote'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /orders:
    get:
      tags: [Commerce]
      operationId: listOrders
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Orders visible to principal
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageMeta'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/Order'}
    post:
      tags: [Commerce]
      operationId: createOrder
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId]
              properties:
                quoteId: {type: string, format: uuid}
      responses:
        '201':
          description: Order created and stock reserved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BusinessRuleError'}
  /orders/{orderId}:
    get:
      tags: [Commerce]
      operationId: getOrder
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      responses:
        '200':
          description: Owned, globally visible, or assigned order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404': {$ref: '#/components/responses/NotFound'}
  /orders/{orderId}/cancel:
    post:
      tags: [Commerce]
      operationId: cancelOrder
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/OrderId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200':
          description: Cancelled or cancellation awaiting refund
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '409': {$ref: '#/components/responses/Conflict'}
  /payments/attempts:
    post:
      tags: [Payment]
      operationId: createPaymentAttempt
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderId]
              properties:
                orderId: {$ref: '#/components/schemas/ObjectId'}
      responses:
        '201':
          description: Pending attempt; amount and bank data come from server 
            configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentAttempt'}
        '409': {$ref: '#/components/responses/Conflict'}
  /payments/{paymentId}:
    get:
      tags: [Payment]
      operationId: getPayment
      x-implementation-status: partial
      parameters:
      - name: paymentId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      responses:
        '200':
          description: Payment visible to owner or authorized operator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentAttempt'}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/payment/gpmpay:
    post:
      tags: [Payment]
      operationId: receiveGpmpayWebhook
      security: []
      x-implementation-status: partial
      parameters:
      - name: X-GPMPay-Signature
        in: header
        required: true
        schema: {type: string, pattern: '^t=[0-9]+,v1=[A-Fa-f0-9]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '204': {description: Verified event accepted, ignored: null, reviewed: 
            null, or deduplicated: null}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {description: Transaction failed; provider should retry}
        '404': {description: GPM Pay is not the active payment provider}
  /webhooks/payment/sepay:
    post:
      tags: [Payment]
      operationId: receiveSepayWebhook
      security: []
      x-implementation-status: partial
      parameters:
      - name: Authorization
        in: header
        required: true
        schema: {type: string, description: 'Apikey <SEPAY_WEBHOOK_API_KEY>'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Event accepted, reviewed, or deduplicated
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: {type: boolean, const: true}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {description: Transaction failed; SePay should retry}
        '404': {description: SePay is not the active payment provider}
  /admin/refunds:
    post:
      tags: [Operations]
      operationId: proposeRefund
      x-permissions: [ADMIN, refund.propose]
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paymentAttemptId, amount, reason, beneficiary]
              properties:
                paymentAttemptId: {$ref: '#/components/schemas/ObjectId'}
                amount: {$ref: '#/components/schemas/Money'}
                reason: {type: string, minLength: 3, maxLength: 500}
                beneficiary: {$ref: '#/components/schemas/RefundBeneficiary'}
      responses:
        '201':
          description: Refund proposal created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '422': {$ref: '#/components/responses/BusinessRuleError'}
    get:
      tags:
      - Payment
      operationId: listAdminRefunds
      x-implementation-status: partial
      responses:
        '200':
          description: Request processed
  /admin/refunds/{refundId}:
    get:
      tags: [Operations]
      operationId: getRefund
      x-permissions: [ADMIN, refund.propose]
      x-implementation-status: partial
      parameters:
      - name: refundId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      responses:
        '200':
          description: Refund status and, for authorized operators, approved 
            transfer instructions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/refunds/{refundId}/beneficiary:
    patch:
      tags: [Operations]
      operationId: setRefundBeneficiary
      x-permissions: [ADMIN, refund.propose]
      x-implementation-status: partial
      description: Set recipient before approval, including for an automatic 
        cancellation proposal. Immutable after approval.
      parameters:
      - name: refundId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundBeneficiary'}
      responses:
        '200':
          description: Recipient snapshot stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/refunds/{refundId}/complete:
    patch:
      tags: [Operations]
      operationId: completeRefund
      x-permissions: [ADMIN]
      x-implementation-status: partial
      parameters:
      - name: refundId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      description: Manual review fallback only when the outgoing webhook lacks 
        sufficient counterparty data; requires bank statement evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bankReference, evidenceObjectKey]
              properties:
                bankReference: {type: string, minLength: 3, maxLength: 100}
                evidenceObjectKey: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '200':
          description: Refund completed after audited manual reconciliation by 
            an Admin different from proposer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/refunds/{refundId}/approve:
    patch:
      tags: [Operations]
      operationId: approveRefund
      x-permissions: [ADMIN]
      x-implementation-status: partial
      parameters:
      - name: refundId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Approved by an Admin different from proposer; response 
            includes recipient VietQR and unique refund reconciliation code; 
            transfer is still pending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/refunds/{refundId}/fail:
    patch:
      tags: [Operations]
      operationId: failRefund
      x-permissions: [ADMIN]
      x-implementation-status: partial
      description: Mark failed only after verifying that no outgoing transfer 
        occurred; late webhook remains in review.
      parameters:
      - name: refundId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, evidenceObjectKey]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
                evidenceObjectKey: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '200':
          description: Refund marked failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/jobs/{jobId}:
    get:
      tags: [Experience]
      operationId: getAiJob
      x-implementation-status: partial
      parameters:
      - name: jobId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      responses:
        '200':
          description: Owned AI job with short-lived result URLs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiJob'}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications:
    get:
      tags: [Notification]
      operationId: listNotifications
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Notifications owned by principal
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PageMeta'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/Notification'}
  /notifications/{notificationId}/read:
    patch:
      tags: [Notification]
      operationId: markNotificationRead
      x-implementation-status: partial
      parameters:
      - name: notificationId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ObjectId'}
      responses:
        '200':
          description: Idempotently marked as read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/me:
    get:
      tags: [Auth]
      operationId: getMyProfile
      x-implementation-status: partial
      responses:
        '200': {$ref: '#/components/responses/UserProfileResponse'}
    patch:
      tags: [Auth]
      operationId: updateMyProfile
      x-implementation-status: partial
      requestBody: {$ref: '#/components/requestBodies/ProfileWrite'}
      responses:
        '200': {$ref: '#/components/responses/UserProfileResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /users/me/addresses:
    get:
      tags: [Auth]
      operationId: listMyAddresses
      x-implementation-status: partial
      responses:
        '200': {$ref: '#/components/responses/AddressListResponse'}
    post:
      tags: [Auth]
      operationId: createMyAddress
      x-implementation-status: partial
      requestBody: {$ref: '#/components/requestBodies/AddressWrite'}
      responses:
        '201': {$ref: '#/components/responses/AddressResponse'}
  /users/me/addresses/{addressId}:
    patch:
      tags: [Auth]
      operationId: updateMyAddress
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/AddressId'}
      requestBody: {$ref: '#/components/requestBodies/AddressWrite'}
      responses:
        '200': {$ref: '#/components/responses/AddressResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Auth]
      operationId: deleteMyAddress
      x-implementation-status: partial
      parameters:
      - {$ref: '#/components/parameters/AddressId'}
      responses:
        '204': {description: Address deleted}
        '404': {$ref: '#/components/responses/NotFound'}
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, minLength: 1, maxLength: 128}
                newPassword: {type: string, minLength: 12, maxLength: 128}
      responses:
        '204': {description: Password changed and all sessions revoked}
        '400': {$ref: '#/components/responses/ValidationError'}
  /storage/presign:
    post:
      tags: [Experience]
      operationId: presignUpload
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, sizeBytes, purpose]
              properties:
                contentType: {type: string, enum: [image/jpeg, image/png, 
                      image/webp]}
                sizeBytes: {type: integer, minimum: 1, maximum: 10485760, description: 'Must match the PUT Content-Length exactly; configured limit may be lower.'}
                purpose: {type: string, enum: [avatar, product, lookbook, 
                      community, tryon, refund_evidence]}
      responses:
        '201': {$ref: '#/components/responses/PresignedUploadResponse'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /storage/upload:
    post:
      tags: [Experience]
      operationId: uploadImageFallback
      x-implementation-status: implemented
      description: Same-origin fallback for a previously issued upload. Checks ownership, pending state, expiry, MIME and exact size; writes only to the private bucket without overwriting. Finalize remains required.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [objectKey, file]
              properties:
                objectKey: {type: string, minLength: 1, maxLength: 1024}
                file: {type: string, format: binary, description: 'JPEG, PNG or WebP. Maximum 10 MiB; the configured upload limit may be lower.'}
      responses:
        '201':
          description: Object uploaded or already exists; call finalize to verify it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploaded: {type: boolean, const: true}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {description: Multipart upload exceeds the size limit}
        '422': {$ref: '#/components/responses/BusinessRuleError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /storage/finalize:
    post:
      tags: [Experience]
      operationId: finalizeUpload
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [objectKey]
              properties:
                objectKey: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '201': {$ref: '#/components/responses/MediaObjectResponse'}
        '422': {$ref: '#/components/responses/BusinessRuleError'}
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      security: []
      x-implementation-status: partial
      responses:
        '200': {$ref: '#/components/responses/CategoryListResponse'}
    post:
