              items:
                type: array
                items: {$ref: '#/components/schemas/Voucher'}
    ReviewResponse:
      description: Review
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Review'}
    PostResponse:
      description: Community post
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommunityPost'}
    PostListResponse:
      description: Public community posts
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: {$ref: '#/components/schemas/CommunityPost'}
    CommentResponse:
      description: Comment
