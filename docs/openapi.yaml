    AcceptedResource:
      description: Resource accepted/created
      content:
        application/json:
          schema:
            type: object
            required: [id, message]
            properties:
              id: {type: string}
              message: {type: string}
    Message:
      description: Generic non-sensitive result
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: {type: string}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing, invalid, expired, or revoked authentication
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authenticated principal lacks permission
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Missing or hidden by ownership rules
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State, version, uniqueness, or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BusinessRuleError:
      description: Valid request violates a business rule
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Rate or quota exceeded
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Required provider/dependency unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
security:
