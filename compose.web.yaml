# Standalone frontend server. No API container, migration, or API env file is needed.
services:
  web:
    image: ${WEB_IMAGE:-fashion-commerce-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?Set PUBLIC_API_BASE_URL to the public backend URL including /api/v1}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
